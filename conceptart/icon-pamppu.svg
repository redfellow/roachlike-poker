<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="16" fill="#1C1A17"/>
  <!-- Top Carry Handle -->
  <path d="M 38,22 C 38,14 62,14 62,22" fill="none" stroke="#556B2F" stroke-width="5" stroke-linecap="round"/>
  <!-- Main Backpack Body -->
  <rect x="22" y="22" width="56" height="62" rx="14" fill="#556B2F" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Front Zipper Pocket -->
  <rect x="30" y="50" width="40" height="26" rx="6" fill="#3E4F22" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Zipper Line -->
  <line x1="34" y1="56" x2="66" y2="56" stroke="#D2B48C" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Shoulder Strap Highlights -->
  <line x1="22" y1="34" x2="16" y2="68" stroke="#D2B48C" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="34" x2="84" y2="68" stroke="#D2B48C" stroke-width="4" stroke-linecap="round"/>
</svg>
